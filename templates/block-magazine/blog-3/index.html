<!doctype html>
<html lang="en">
  <head>
    <!-- React Router Nested Folder SPA URL Fix -->
    <script>
      if (window.location.pathname.endsWith('/index.html')) {
        const newPath = window.location.pathname.replace(/\/index\.html$/, '/');
        window.history.replaceState(null, '', newPath + window.location.search + window.location.hash);
      }
    </script>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Future Intelligence — A premium digital magazine about artificial intelligence and the technologies shaping tomorrow." />
    <title>Future Intelligence — AI & Future Technology Magazine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
