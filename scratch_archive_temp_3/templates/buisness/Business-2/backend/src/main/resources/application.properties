# Spring Datasource Configurations
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:business_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configurations
# 256-bit secret key (in base64) for JWT token signature
app.jwt.secret=dGhpc2lzYW1vZGVybnByZW1pdW1mdWxsc3RhY2thZ2VuY3l3ZWJzaXRlc2VjcmV0a2V5MjU2Yml0cw==
# JWT Expiration: 1 day in milliseconds (24 * 60 * 60 * 1000 = 86400000)
app.jwt.expiration-ms=86400000

# Server Port
server.port=8080

# Logging Level
logging.level.org.springframework.security=INFO
logging.level.com.agency.backend=DEBUG
