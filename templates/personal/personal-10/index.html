<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <!-- React Router Nested Folder SPA URL Fix -->
    <script>
      if (window.location.pathname.endsWith('/index.html')) {
        const newPath = window.location.pathname.replace(/\/index\.html$/, '/');
        window.history.replaceState(null, '', newPath + window.location.search + window.location.hash);
      }
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arjun Dev - Full Stack Developer & UI/UX Enthusiast</title>
    <meta name="description" content="Portfolio of Arjun Dev, a Full Stack Developer & UI/UX Enthusiast building modern, responsive and user-friendly web applications." />
    <meta property="og:title" content="Arjun Dev - Full Stack Developer & UI/UX Enthusiast" />
    <meta property="og:description" content="Portfolio of Arjun Dev, a Full Stack Developer & UI/UX Enthusiast building modern, responsive and user-friendly web applications." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('arjun_portfolio_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F9FAFB] dark:bg-[#030712] text-gray-900 dark:text-gray-100 antialiased selection:bg-gray-900 selection:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
