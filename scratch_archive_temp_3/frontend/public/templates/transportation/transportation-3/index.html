<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/templates/transportation/transportation-3/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleetrise — Smart Fleet Intelligence & Analytics</title>
    <script>
      window.addEventListener('error', function(event) {
        var errorDiv = document.getElementById('global-error-overlay');
        if (!errorDiv) {
          errorDiv = document.createElement('div');
          errorDiv.id = 'global-error-overlay';
          errorDiv.style.position = 'fixed';
          errorDiv.style.top = '0';
          errorDiv.style.left = '0';
          errorDiv.style.width = '100%';
          errorDiv.style.height = '100%';
          errorDiv.style.backgroundColor = 'rgba(254, 242, 242, 0.95)';
          errorDiv.style.color = '#991b1b';
          errorDiv.style.padding = '20px';
          errorDiv.style.boxSizing = 'border-box';
          errorDiv.style.fontFamily = 'monospace';
          errorDiv.style.fontSize = '14px';
          errorDiv.style.zIndex = '999999';
          errorDiv.style.overflow = 'auto';
          errorDiv.innerHTML = '<h2 style="margin-top:0;color:#991b1b;">Runtime Crash Detected</h2>';
          document.body.appendChild(errorDiv);
        }
        var msg = document.createElement('pre');
        msg.style.whiteSpace = 'pre-wrap';
        msg.style.backgroundColor = '#fee2e2';
        msg.style.padding = '10px';
        msg.style.border = '1px solid #fca5a5';
        msg.style.borderRadius = '4px';
        msg.textContent = event.message + '\nat ' + event.filename + ':' + event.lineno + ':' + event.colno + '\n\n' + (event.error ? event.error.stack : '');
        errorDiv.appendChild(msg);
      });
      window.addEventListener('unhandledrejection', function(event) {
        var errorDiv = document.getElementById('global-error-overlay');
        if (!errorDiv) {
          errorDiv = document.createElement('div');
          errorDiv.id = 'global-error-overlay';
          errorDiv.style.position = 'fixed';
          errorDiv.style.top = '0';
          errorDiv.style.left = '0';
          errorDiv.style.width = '100%';
          errorDiv.style.height = '100%';
          errorDiv.style.backgroundColor = 'rgba(254, 242, 242, 0.95)';
          errorDiv.style.color = '#991b1b';
          errorDiv.style.padding = '20px';
          errorDiv.style.boxSizing = 'border-box';
          errorDiv.style.fontFamily = 'monospace';
          errorDiv.style.fontSize = '14px';
          errorDiv.style.zIndex = '999999';
          errorDiv.style.overflow = 'auto';
          errorDiv.innerHTML = '<h2 style="margin-top:0;color:#991b1b;">Unhandled Rejection Detected</h2>';
          document.body.appendChild(errorDiv);
        }
        var msg = document.createElement('pre');
        msg.style.whiteSpace = 'pre-wrap';
        msg.style.backgroundColor = '#fee2e2';
        msg.style.padding = '10px';
        msg.style.border = '1px solid #fca5a5';
        msg.style.borderRadius = '4px';
        msg.textContent = 'Unhandled promise rejection: ' + event.reason;
        errorDiv.appendChild(msg);
      });
    </script>
