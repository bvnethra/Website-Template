spring.datasource.url=jdbc:h2:mem:technosprint_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA and Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Port
server.port=8080

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# JWT Configuration Properties
technosprint.app.jwtSecret=TechnoSprintTemplatesSuperSecretKeyWhichIsAtLeast256BitsLongForHMACSHA256
technosprint.app.jwtExpirationMs=86400000

# Enable console printing for easier debugging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
