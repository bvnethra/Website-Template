server.port=5000

# H2 Database Settings
spring.datasource.url=jdbc:h2:file:./data/auradb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Spring Security Headers
spring.main.allow-bean-definition-overriding=true

# JWT Token Configuration
# Secret key is base64 encoded for security
aura.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
aura.jwt.expiration-ms=86400000
