<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <!-- React Router Nested Folder SPA URL Fix -->
    <script>
      if (window.location.pathname.endsWith('/index.html')) {
        const newPath = window.location.pathname.replace(/\/index\.html$/, '/');
        window.history.replaceState(null, '', newPath + window.location.search + window.location.hash);
      }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA SKY RESIDENCES — Premium Cinematic Building Launch</title>
    <meta name="description" content="A new landmark is coming. Experience a new standard of modern architecture, comfort, and premium luxury living at Aura Sky Residences.">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            gold: '#d4af37',
                            goldHover: '#c5a028',
                            charcoal: '#121214',
                            darkGray: '#1c1c1f',
                            lightGray: '#f4f4f6',
                            goldGlow: 'rgba(212, 175, 55, 0.3)'
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        serif: ['Cinzel', 'serif']
                    }

        }
    </script>
</head>
<body class="bg-brand-charcoal text-white font-sans antialiased overflow-x-hidden">
