# Database Connection Properties (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/technosprint_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Console
spring.h2.console.enabled=false

# JPA and Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8080

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# JWT Configuration Properties
technosprint.app.jwtSecret=TechnoSprintTemplatesSuperSecretKeyWhichIsAtLeast256BitsLongForHMACSHA256
technosprint.app.jwtExpirationMs=86400000

# Enable console printing for easier debugging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
