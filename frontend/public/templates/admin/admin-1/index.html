    <!-- Client-Side Routing & Mock API Interceptor -->
    <script>
      (function() {
        // 1. Universal SPA Subfolder Pathname Normalizer on Location.prototype
        try {
          const origGetter = Object.getOwnPropertyDescriptor(Location.prototype, 'pathname').get;
          Object.defineProperty(Location.prototype, 'pathname', {
            get: function() {
              let p = origGetter.call(this);
              const match = p.match(/^(\/templates\/[^\/]+\/[^\/]+)/);
              if (match && match[1]) {
                p = p.slice(match[1].length);
                if (p.endsWith('/index.html')) p = p.slice(0, -11);
                if (!p || !p.startsWith('/')) p = '/' + p;
              }
              return p;
            },
            configurable: true
          });
        } catch (e) {
          console.warn('Pathname override error:', e);
        }

        // 2. Mock API Interceptor for offline/standalone execution
        const mockResponses = {
          '/analytics/summary': {
            revenue: { value: 128450, change: 12.5, isIncrease: true, comparison: "vs last month" },
            orders: { value: 1420, change: 8.2, isIncrease: true, comparison: "vs last month" },
            customers: { value: 892, change: 5.1, isIncrease: true, comparison: "vs last month" },
            users: { value: 3410, change: 14.3, isIncrease: true, comparison: "vs last month" }
          },
          '/analytics/revenue-chart': [
            { label: "Jan", revenue: 12000 },
            { label: "Feb", revenue: 19000 },
            { label: "Mar", revenue: 15000 },
            { label: "Apr", revenue: 22000 },
            { label: "May", revenue: 28000 },
            { label: "Jun", revenue: 34000 }
          ],
          '/analytics/category-distribution': [
            { name: "Electronics", value: 400 },
            { name: "Fashion", value: 300 },
            { name: "Home & Garden", value: 200 },
            { name: "Sports", value: 150 }
          ],
          '/orders': {
            content: [
              {
                id: 1001,
                customer: { name: "Alex Johnson", profileImage: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" },
                orderDate: "2026-08-30T10:00:00Z",
                amount: 299.99,
                paymentStatus: "COMPLETED",
                orderStatus: "DELIVERED"
              },
              {
                id: 1002,
                customer: { name: "Sarah Miller", profileImage: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150" },
                orderDate: "2026-08-31T14:30:00Z",
                amount: 149.50,
                paymentStatus: "COMPLETED",
                orderStatus: "PROCESSING"
              }
            ],
            totalPages: 1,
            totalElements: 2
          },
          '/users': [
            { id: 1, username: 'admin', email: 'admin@technosprint.com', role: 'ROLE_ADMIN', status: 'ACTIVE' }
          ],
          '/customers': {
            content: [
              { id: 1, name: "Alex Johnson", email: "alex@example.com", status: "ACTIVE", totalOrders: 12, totalSpending: 2450.00 }
            ]
          },
          '/products': {
            content: [
              { id: 1, name: "Wireless Headphones", price: 129.99, discount: 10, stock: 45, status: "IN_STOCK", category: { id: 1, name: "Electronics" } }
            ]
          }
        };

        // Intercept XMLHttpRequest (for Axios)
        const origOpen = XMLHttpRequest.prototype.open;
        const origSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.open = function(method, url) {
          this._url = url;
          return origOpen.apply(this, arguments);
        };
        XMLHttpRequest.prototype.send = function(body) {
          const self = this;
          for (const [endpoint, data] of Object.entries(mockResponses)) {
            if (self._url && self._url.includes(endpoint)) {
              setTimeout(() => {
                Object.defineProperty(self, 'readyState', { value: 4 });
                Object.defineProperty(self, 'status', { value: 200 });
                Object.defineProperty(self, 'responseText', { value: JSON.stringify(data) });
                Object.defineProperty(self, 'response', { value: JSON.stringify(data) });
                if (typeof self.onreadystatechange === 'function') self.onreadystatechange();
                if (typeof self.onload === 'function') self.onload();
              }, 100);
              return;
            }
          }
          return origSend.apply(this, arguments);
        };

        // Intercept fetch
        const origFetch = window.fetch;
        window.fetch = function(input, init) {
          const urlStr = typeof input === 'string' ? input : (input && input.url ? input.url : '');
          for (const [endpoint, data] of Object.entries(mockResponses)) {
            if (urlStr.includes(endpoint)) {
              return Promise.resolve(new Response(JSON.stringify(data), {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              }));
            }
          }
          return origFetch.apply(this, arguments);
        };
      })();
    </script>

  <!-- TechnoSprint Responsive Template Preview Wrapper Script -->
  <script>
    (function() {
      const isPlatform = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const isTop = window.self === window.top;
      const urlParams = new URLSearchParams(window.location.search);
      const isIframe = urlParams.get('iframe') === 'true';
      
      if (isPlatform && isTop && !isIframe) {
        document.documentElement.style.visibility = 'hidden';
        
        window.addEventListener('DOMContentLoaded', () => {
          const currentUrl = new URL(window.location.href);
          if (!currentUrl.pathname.endsWith('index.html')) { currentUrl.pathname = currentUrl.pathname.replace(/\/?$/, '/index.html'); }
          currentUrl.searchParams.set('iframe', 'true');
          
          const body = document.body;
          body.innerHTML = '';
          body.style.margin = '0';
          body.style.padding = '0';
          body.style.height = '100vh';
          body.style.width = '100vw';
          body.style.display = 'flex';
          body.style.flexDirection = 'column';
          body.style.overflow = 'hidden';
          body.style.backgroundColor = '#f1f5f9';
          
          // Build Top Bar
          const topBar = document.createElement('div');
          topBar.id = 'technosprint-preview-header';
          topBar.style.height = '64px';
          topBar.style.background = '#ffffff';
          topBar.style.borderBottom = '1px solid #e2e8f0';
          topBar.style.display = 'flex';
          topBar.style.alignItems = 'center';
          topBar.style.justifyContent = 'space-between';
          topBar.style.padding = '0 24px';
          topBar.style.boxShadow = '0 1px 3px rgba(0, 0, 0, 0.05)';
          topBar.style.fontFamily = "'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
          topBar.style.zIndex = '99999';
          topBar.style.position = 'relative';
          topBar.style.boxSizing = 'border-box';
          
          // Left side logo
          const logoDiv = document.createElement('div');
          logoDiv.innerHTML = '<a href="/templates" style="display: flex; align-items: center; text-decoration: none;"><img src="/logo.jpg" alt="TechnoSprint Logo" style="height: 32px; border-radius: 6px; border: 1px solid #e2e8f0;" /></a>';
          topBar.appendChild(logoDiv);
          
          // Center Template Name
          const titleDiv = document.createElement('div');
          titleDiv.style.fontWeight = '600';
          titleDiv.style.fontSize = '0.9rem';
          titleDiv.style.color = '#334155';
          titleDiv.innerText = '< ' + (document.title || 'Template Preview') + ' >';
          topBar.appendChild(titleDiv);
          
          // Right view switcher buttons
          const rightDiv = document.createElement('div');
          rightDiv.style.display = 'flex';
          rightDiv.style.alignItems = 'center';
          rightDiv.style.gap = '8px';
          rightDiv.innerHTML = '' +
            '<button id="view-desktop" style="' +
            '  background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe;' +
            '  padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 600;' +
            '  cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s;' +
            '  outline: none; box-sizing: border-box;' +
            '">' +
            '  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>' +
            '  Desktop' +
            '</button>' +
            '<button id="view-tablet" style="' +
            '  background: #ffffff; color: #475569; border: 1px solid #e2e8f0;' +
            '  padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 500;' +
            '  cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s;' +
            '  outline: none; box-sizing: border-box;' +
            '">' +
            '  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>' +
            '  Tablet' +
            '</button>' +
            '<button id="view-mobile" style="' +
            '  background: #ffffff; color: #475569; border: 1px solid #e2e8f0;' +
            '  padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 500;' +
            '  cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s;' +
            '  outline: none; box-sizing: border-box;' +
            '">' +
            '  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>' +
            '  Mobile' +
            '</button>';
          topBar.appendChild(rightDiv);
          body.appendChild(topBar);
          
          // Create Iframe Container
          const iframeContainer = document.createElement('div');
          iframeContainer.style.flex = '1';
          iframeContainer.style.display = 'flex';
          iframeContainer.style.alignItems = 'center';
          iframeContainer.style.justifyContent = 'center';
          iframeContainer.style.background = '#f1f5f9';
          iframeContainer.style.padding = '20px';
          iframeContainer.style.boxSizing = 'border-box';
          iframeContainer.style.overflow = 'hidden';
          
          const iframe = document.createElement('iframe');
          iframe.id = 'preview-iframe';
          iframe.src = currentUrl.toString();
          iframe.style.width = '100%';
          iframe.style.height = '100%';
          iframe.style.border = 'none';
          iframe.style.borderRadius = '12px';
          iframe.style.boxShadow = '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)';
          iframe.style.background = '#ffffff';
          iframe.style.transition = 'width 0.3s cubic-bezier(0.4, 0, 0.2, 1), height 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
          
          iframeContainer.appendChild(iframe);
          body.appendChild(iframeContainer);
          
          // Interactivity
          const btnDesktop = body.querySelector('#view-desktop');
          const btnTablet = body.querySelector('#view-tablet');
          const btnMobile = body.querySelector('#view-mobile');
          
          let activeMode = 'desktop';
          
          function setView(mode) {
            activeMode = mode;
            [btnDesktop, btnTablet, btnMobile].forEach(btn => {
              btn.style.background = '#ffffff';
              btn.style.color = '#475569';
              btn.style.borderColor = '#e2e8f0';
              btn.style.fontWeight = '500';
            });
            
            if (mode === 'desktop') {
              btnDesktop.style.background = '#eff6ff';
              btnDesktop.style.color = '#1e40af';
              btnDesktop.style.borderColor = '#bfdbfe';
              btnDesktop.style.fontWeight = '600';
              iframe.style.width = '100%';
              iframe.style.height = '100%';
              iframe.style.borderRadius = '12px';
              iframe.style.border = 'none';
            } else if (mode === 'tablet') {
              btnTablet.style.background = '#eff6ff';
              btnTablet.style.color = '#1e40af';
              btnTablet.style.borderColor = '#bfdbfe';
              btnTablet.style.fontWeight = '600';
              iframe.style.width = '768px';
              iframe.style.height = '1024px';
              iframe.style.maxHeight = '100%';
              iframe.style.borderRadius = '24px';
              iframe.style.border = '12px solid #0f172a';
            } else if (mode === 'mobile') {
              btnMobile.style.background = '#eff6ff';
              btnMobile.style.color = '#1e40af';
              btnMobile.style.borderColor = '#bfdbfe';
              btnMobile.style.fontWeight = '600';
              iframe.style.width = '375px';
              iframe.style.height = '667px';
              iframe.style.maxHeight = '100%';
              iframe.style.borderRadius = '32px';
              iframe.style.border = '14px solid #0f172a';
            }
          }
          
          btnDesktop.addEventListener('click', () => setView('desktop'));
          btnTablet.addEventListener('click', () => setView('tablet'));
          btnMobile.addEventListener('click', () => setView('mobile'));
          
          const btns = [
            { btn: btnDesktop, mode: 'desktop' },
            { btn: btnTablet, mode: 'tablet' },
            { btn: btnMobile, mode: 'mobile' }
          ];
          
          btns.forEach(item => {
            item.btn.addEventListener('mouseenter', () => {
              if (activeMode !== item.mode) {
                item.btn.style.background = '#f8fafc';
                item.btn.style.borderColor = '#cbd5e1';
              }
            });
            item.btn.addEventListener('mouseleave', () => {
              if (activeMode !== item.mode) {
                item.btn.style.background = '#ffffff';
                item.btn.style.borderColor = '#e2e8f0';
              }
            });
          });
          
          document.documentElement.style.visibility = 'visible';
        });
      }
    })();
  </script>

    <div id="root"></div>
  </body>
