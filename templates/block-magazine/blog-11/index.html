<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <!-- React Router Nested Folder SPA URL Fix -->
    <script>
      if (window.location.pathname.endsWith('/index.html')) {
        const newPath = window.location.pathname.replace(/\/index\.html$/, '/');
        window.history.replaceState(null, '', newPath + window.location.search + window.location.hash);
      }
    </script>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGROTECH AI — Agriculture, Technology & Artificial Intelligence</title>
    <meta name="description" content="Where Agriculture Meets Technology & Artificial Intelligence. The premier digital editorial magazine exploring smart farming, robotics, precision agriculture, and AI crop intelligence." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-paper-light text-paper-dark antialiased selection:bg-agri-green selection:text-white overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
