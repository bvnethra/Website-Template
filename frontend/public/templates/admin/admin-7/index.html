    <script>
      (function() {
        try {
          var savedSettings = localStorage.getItem('sprintadmin_settings') || localStorage.getItem('nexus_settings');
          var theme = 'system';
          if (savedSettings) {
            var parsed = JSON.parse(savedSettings);
            if (parsed && parsed.theme) {
              theme = parsed.theme;
            }
          }
          // Also check explicit standalone sprintadmin-theme key if exists
          var explicitTheme = localStorage.getItem('sprintadmin-theme') || localStorage.getItem('nexus-theme');
          if (explicitTheme) {
            theme = explicitTheme;
          } else {
            localStorage.setItem('sprintadmin-theme', theme);
          }
          
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {
          console.warn("Theme preloader exception:", e);
        }
      })();
    </script>

    <!-- Client-Side Routing & Mock API Interceptor for Standalone Execution -->
    <script>
      (function() {
        // 1. SPA Subfolder Pathname Normalizer for React Router
        try {
          const origPathname = Object.getOwnPropertyDescriptor(Location.prototype, 'pathname');
          const match = window.location.pathname.match(/^(\/templates\/[^\/]+\/[^\/]+)/);
          if (match && match[1]) {
            const templateBase = match[1];
            Object.defineProperty(window.location, 'pathname', {
              get: function() {
                let p = origPathname.get.call(this);
                if (p.startsWith(templateBase)) {
                  p = p.slice(templateBase.length);
                  if (!p.startsWith('/')) p = '/' + p;
                }
                return p;
              },
              configurable: true
            });
          }
        } catch (e) {
          console.warn('Pathname override warning:', e);
        }

        // 2. Mock API Interceptor for offline/standalone execution
        const mockResponses = {

            orders: { value: 1420, change: 8.2, isIncrease: true, comparison: "vs last month" },

          '/orders': {

          '/products': {

            ]
          }
        };

        // Intercept XMLHttpRequest (for Axios)
        const origOpen = XMLHttpRequest.prototype.open;
        const origSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.open = function(method, url) {
          this._url = url;
          return origOpen.apply(this, arguments);
        };
        XMLHttpRequest.prototype.send = function(body) {
          const self = this;
          for (const [endpoint, data] of Object.entries(mockResponses)) {
            if (self._url && self._url.includes(endpoint)) {
              setTimeout(() => {
                Object.defineProperty(self, 'readyState', { value: 4 });
                Object.defineProperty(self, 'status', { value: 200 });
                Object.defineProperty(self, 'responseText', { value: JSON.stringify(data) });
                Object.defineProperty(self, 'response', { value: JSON.stringify(data) });
                if (typeof self.onreadystatechange === 'function') self.onreadystatechange();
                if (typeof self.onload === 'function') self.onload();
              }, 100);
              return;
            }
          }
          return origSend.apply(this, arguments);
        };

        // Intercept fetch
        const origFetch = window.fetch;
        window.fetch = function(input, init) {
          const urlStr = typeof input === 'string' ? input : (input && input.url ? input.url : '');
          for (const [endpoint, data] of Object.entries(mockResponses)) {
            if (urlStr.includes(endpoint)) {
              return Promise.resolve(new Response(JSON.stringify(data), {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              }));
            }
          }
          return origFetch.apply(this, arguments);
        };
      })();
