# Server Port
server.port=8080

# Spring Application Name
spring.application.name=neura-dashboard-backend

# Database Configuration (H2 In-Memory Database with MySQL Mode)
spring.datasource.url=jdbc:h2:mem:neura_dashboard;MODE=MySQL;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# SQL Script Execution on Startup
spring.sql.init.mode=always

# JWT Configuration
neura.app.jwtSecret=926A94C138C742D9A695F366E7B61C8B46C38A3A49C942D8A695F366E7B61C8B
neura.app.jwtExpirationMs=86400000
