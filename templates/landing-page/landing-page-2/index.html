<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <!-- React Router Nested Folder SPA URL Fix -->
    <script>
      if (window.location.pathname.endsWith('/index.html')) {
        const newPath = window.location.pathname.replace(/\/index\.html$/, '/');
        window.history.replaceState(null, '', newPath + window.location.search + window.location.hash);
      }
    </script>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF5A1F'><rect width='24' height='24' rx='6'/><circle cx='7' cy='12' r='2' fill='white'/><circle cx='12' cy='12' r='2' fill='white'/><circle cx='17' cy='12' r='2' fill='white'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Busy Status Bar — Productivity multi-tool device</title>
    <meta name="description" content="Busy Status Bar is a productivity multi-tool device with an LED pixel screen. Displays a personal busy message. Built-in Pomodoro timer and Apps." />
