<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <!-- React Router Nested Folder SPA URL Fix -->
    <script>
      if (window.location.pathname.endsWith('/index.html')) {
        const newPath = window.location.pathname.replace(/\/index\.html$/, '/');
        window.history.replaceState(null, '', newPath + window.location.search + window.location.hash);
      }
    </script>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareNova Health — Better Care. Smarter Health.</title>
    <meta name="description" content="CareNova Health is a modern, trusted healthcare network providing specialist consultations, emergency care, telemetry, and advanced medical treatments." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-dark font-sans antialiased selection:bg-primary/20 selection:text-primary min-h-screen flex flex-col">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
