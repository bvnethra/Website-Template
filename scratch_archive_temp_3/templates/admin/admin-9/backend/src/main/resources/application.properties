# Server Configuration
server.port=8080
server.servlet.context-path=

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/admin_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configurations
app.jwt.secret=9a67431a7f3d8f1e29c3a4f8d9b1e5a26c8d7e9b0c2d3a4f5c6a7b8c9d0e1f2a3b4c5d6e7f8
app.jwt.expiration-ms=86400000

# Enable Logging
logging.level.org.springframework.security=INFO
logging.level.com.admin.dashboard=DEBUG
